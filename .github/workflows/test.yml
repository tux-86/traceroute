name: test

# Runs tests/suite.py (needs traceroute.py and tests/suite.py at the repo root)
# on Linux, macOS, FreeBSD and OpenBSD. Raw sockets need root, hence sudo / VM root.
#
# "REQUIRED" tests fail the job. Network- and platform-dependent tests are
# informational: see the job summary for the full table.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo -E python3 tests/suite.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo -E python3 tests/suite.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The raw-socket modes (-U, -T) only receive ICMP errors if the firewall lets them in.
      - name: Allow incoming ICMP errors (Time Exceeded / Destination Unreachable)
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName "ICMPv4 Time Exceeded in" -Direction Inbound -Protocol ICMPv4 -IcmpType 11 -Action Allow
          New-NetFirewallRule -DisplayName "ICMPv4 Unreachable in" -Direction Inbound -Protocol ICMPv4 -IcmpType 3 -Action Allow
          New-NetFirewallRule -DisplayName "ICMPv6 Time Exceeded in" -Direction Inbound -Protocol ICMPv6 -IcmpType 3 -Action Allow
          New-NetFirewallRule -DisplayName "ICMPv6 Unreachable in" -Direction Inbound -Protocol ICMPv6 -IcmpType 1 -Action Allow
      # GitHub's Windows runners run as an administrator, so raw sockets are available.
      - name: Run the test suite
        shell: pwsh
        run: python tests/suite.py

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y python3
          run: |
            python3 tests/suite.py

  # Release and package names change over time; if this job fails to start, check the
  # vmactions/openbsd-vm README for the current release name. It does not block the others.
  openbsd:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.6"
          usesh: true
          prepare: |
            pkg_add python3
          run: |
            python3 tests/suite.py
